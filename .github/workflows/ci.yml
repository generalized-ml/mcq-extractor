name: Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke test the installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          mcq-extract --help
          evaluate-mcqs --help
          python -c 'from pathlib import Path; from mcq_extractor.paths import workspace_root; assert workspace_root() == Path.cwd()'
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: distributions
          path: dist/*
